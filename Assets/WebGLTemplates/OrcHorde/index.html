<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orc Horde FPS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%235effc4%22/%3E%3C/svg%3E">
  <style>
    html, body { margin: 0; height: 100%; background: #0c1014; overflow: hidden; font-family: system-ui, sans-serif; color: #d8e4e0; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #0c1014; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #0c1014; }
    #loading h1 { margin: 0; font-size: 28px; letter-spacing: 0.08em; color: #5effc4; font-weight: 700; }
    #bar { width: min(420px, 70vw); height: 6px; background: #1c2428; border-radius: 3px; overflow: hidden; }
    #fill { width: 0; height: 100%; background: #5effc4; transition: width 0.2s; }
    #note { font-size: 13px; color: #8a9894; }
    #error { display: none; max-width: 560px; padding: 0 24px; text-align: center; color: #ff8a8a; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <h1>ORC HORDE</h1>
    <div id="bar"><div id="fill"></div></div>
    <div id="note">Loading…</div>
    <div id="error"></div>
  </div>
  <script>
    const canvas = document.getElementById("unity-canvas");
    const fill = document.getElementById("fill");
    const note = document.getElementById("note");
    const error = document.getElementById("error");

    // The game draws at the window's size, sharp on high-density screens but capped so a
    // 4K display doesn't quadruple the work.
    function fit() {
      const ratio = Math.min(window.devicePixelRatio || 1, 1.5);
      canvas.width = Math.round(window.innerWidth * ratio);
      canvas.height = Math.round(window.innerHeight * ratio);
    }
    window.addEventListener("resize", fit);
    fit();

    if (!document.createElement("canvas").getContext("webgl2")) {
      note.textContent = "";
      error.style.display = "block";
      error.textContent = "This browser can't run the game: it needs WebGL 2. Try a current Chrome, Edge, Firefox or Safari.";
    } else {
      const script = document.createElement("script");
      script.src = "Build/{{{ LOADER_FILENAME }}}";
      script.onload = () => {
        createUnityInstance(canvas, {
          dataUrl: "Build/{{{ DATA_FILENAME }}}",
          frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
          codeUrl: "Build/{{{ CODE_FILENAME }}}",
          streamingAssetsUrl: "StreamingAssets",
          companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
          productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
          productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
          matchWebGLToCanvasSize: false,
        }, (p) => {
          fill.style.width = Math.round(p * 100) + "%";
          note.textContent = p < 0.9 ? "Loading… " + Math.round(p * 100) + "%" : "Building the map…";
        }).then(() => {
          document.getElementById("loading").remove();
          canvas.focus();
        }).catch((message) => {
          note.textContent = "";
          error.style.display = "block";
          error.textContent = "The game couldn't start: " + message;
        });
      };
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
